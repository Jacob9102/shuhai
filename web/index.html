<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="书海 · 自托管全网小说搜索与阅读服务前端">
<meta name="color-scheme" content="light dark">
<title>书海 · 全网小说搜索阅读</title>
<!-- 内联 data URI 图标，不依赖任何外部资源 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fed'/%3E%3Cpath d='M9 8h9a3 3 0 0 1 3 3v13H12a3 3 0 0 0-3 3z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-route="search">
<div id="app">
  <header id="app-nav" class="app-nav">
    <a class="brand" href="#/search">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z"/><path d="M20 6v13"/></svg>
      </span>
      <span class="brand-text">书海</span>
    </a>
    <nav class="nav-links">
      <a class="nav-link" data-nav="search" href="#/search">搜索</a>
      <a class="nav-link" data-nav="shelf" href="#/shelf">书架</a>
      <a class="nav-link" data-nav="sources" href="#/sources">书源</a>
      <a class="nav-link" data-nav="settings" href="#/settings">设置</a>
    </nav>
    <div class="nav-right">
      <span id="server-badge" class="server-badge" title="后端连接状态">
        <span class="dot"></span><span class="server-text">检测中</span>
      </span>
      <button id="theme-toggle" class="btn icon-btn" type="button" title="切换界面主题" aria-label="切换界面主题"></button>
    </div>
  </header>

  <main id="view" class="view" role="main">
    <div class="boot-loading">
      <div class="spinner"></div>
      <p>正在加载书海…</p>
    </div>
  </main>
</div>

<div id="toast-root" class="toast-root"></div>
<div id="modal-root"></div>

<noscript>
  <div class="noscript-tip">书海需要启用 JavaScript 才能运行，请在浏览器设置中开启后刷新页面。</div>
</noscript>

<script type="module" src="/js/main.js"></script>
</body>
</html>
